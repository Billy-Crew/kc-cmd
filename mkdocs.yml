site_name: KC Command Usage
site_description: KC Command Usage
site_url: https://billy-crew.github.io/kc-cmd/

theme:
  name: material
  language: ko
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: custom/moon
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: custom/sun
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css
  - stylesheets/extra.css

nav:
  - 시작하기:
      - KC Command 소개: index.md
      - 명령어 한눈에 보기: 02_명령어-한눈에-보기.md
  - 설정과 점검:
      - 초기 설정과 점검: 03_초기-설정과-점검.md
      - 송출 설정: 04_송출-설정.md
  - 서비스 운영:
      - 서비스 기동과 종료: 05_서비스-기동과-종료.md
      - 서비스 모니터링: 06_서비스-모니터링.md
      - 증적 조회와 재생: 07_증적-조회와-재생.md
  - 운영 도구:
      - 운영 도구: 08_운영-도구.md
  - 응용 활용:
      - 증적을 TXT/CSV로 변환하기: 09_증적-TXT-CSV-변환.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
